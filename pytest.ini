[pytest]
testpaths = simulator/tests
addopts = -p no:cacheprovider -m "not slow"
markers =
    slow: marks tests as slow (full-model plug_flow ODE integration, >5 min)
norecursedirs =
    .*
    __pycache__
    rag/db
    rag/extracted
    simulator/.pyadm1_runtime
    simulator/tests/.tmp
    simulator/tests/tmp_literature_validation
    pytest-cache-files-*
