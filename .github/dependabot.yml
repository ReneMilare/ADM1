version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.x renamed FastMCP; migrating simulator/mcp_server.py is a separate task.
      - dependency-name: mcp
        versions: [">=2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
